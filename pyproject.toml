[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jdgram"
version = "0.1.0"
description = "Exact Gramian engines for Jacobian Descent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 2.4 is the floor that matters: is_grads_batched, torch.func.vjp and the
    # full-backward-hook signatures the engine relies on are all stable from
    # there. The cluster runs 2.13; the gates pass on both.
    "torch>=2.4",
    "numpy",
]

[project.optional-dependencies]
# torchjd is the reference engine every gate and benchmark compares against, so
# it is not optional in any meaningful sense -- it is separated only because the
# library itself has no runtime dependency on it.
bench = [
    "torchjd>=0.17",
    "matplotlib",
    "pandas",
]
test = [
    "pytest>=7.0",
    "torchjd>=0.17",
]

# jdgram lives under src/; models/ stays at repo root (bench imports both).
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["jdgram*", "models*"]
exclude = ["gates*", "bench*", "docs*", "scripts*", "results*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["gates"]
addopts = "-q"
